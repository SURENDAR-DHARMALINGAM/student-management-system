<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Delete Student - Student Management System</title>

    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: Arial, sans-serif;
            background: #f4f6f8;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .delete-card {
            width: 100%;
            max-width: 500px;
            background: white;
            padding: 35px;
            border-radius: 12px;
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.1);
            text-align: center;
        }

        .delete-icon {
            font-size: 50px;
            margin-bottom: 15px;
        }

        h2 {
            margin-bottom: 15px;
            color: #222;
        }

        .warning {
            color: #666;
            line-height: 1.6;
            margin-bottom: 10px;
        }

        .student-name {
            font-weight: bold;
            color: #dc2626;
            margin-bottom: 25px;
        }

        .buttons {
            display: flex;
            justify-content: center;
            gap: 12px;
        }

        .cancel-btn,
        .delete-btn {
            padding: 11px 20px;
            border-radius: 6px;
            text-decoration: none;
            font-weight: bold;
            font-size: 14px;
            cursor: pointer;
        }

        .cancel-btn {
            background: #6b7280;
            color: white;
        }

        .delete-btn {
            background: #dc2626;
            color: white;
            border: none;
        }

        .cancel-btn:hover {
            background: #4b5563;
        }

        .delete-btn:hover {
            background: #b91c1c;
        }

        @media (max-width: 500px) {
            .delete-card {
                margin: 20px;
                padding: 25px;
            }

            .buttons {
                flex-direction: column;
            }
        }
    </style>
</head>

<body>

    <div class="delete-card">

        <div class="delete-icon">
            ⚠️
        </div>

        <h2>Delete Student?</h2>

        <p class="warning">
            Are you sure you want to delete this student?
        </p>

        <p class="student-name">
            {{ student.roll_number }} - {{ student.student_name }}
        </p>

        <div class="buttons">

            <a
                href="{% url 'dashboard' %}"
                class="cancel-btn"
            >
                Cancel
            </a>

            <form
                method="post"
                style="display: inline;"
            >

                {% csrf_token %}

                <button
                    type="submit"
                    class="delete-btn"
                >
                    Delete Student
                </button>

            </form>

        </div>

    </div>

</body>
</html>
